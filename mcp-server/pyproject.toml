[project]
name = "unicompass-mcp"
version = "0.1.0"
description = "MCP server exposing a student's UniCompass opportunity feed to AI assistants"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
unicompass-mcp = "unicompass_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unicompass_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
